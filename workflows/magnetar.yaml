workflow:
  schema_version: '1.0'
  name: magnetar
  entry_skill: .codex/skills/magnetar/SKILL.md
  mode: guided
  task_type: deterministic
  visibility: collapsed_by_default
  requirement:
    goal: Convert a remote or local model into an AXera AXMODEL package with customer-facing Python and C++ SDKs.
    output:
      format: directory
      destination: TASK_DIR/package/
      consumer: both
    constraints:
      time_budget: per-model, no global fixed limit
      cost_budget: no paid external actions without user approval
      technology:
      - Pulsar2 for ONNX to AXMODEL compilation
      - 'LLM/自回归模型路由：Pulsar2 llm_build2（直接编译 HuggingFace 权重为逐层
        axmodel）+ AXERA-TECH/ax-llm（axllm 分支）板端运行/服务；通用模型仍走
        ONNX -> pulsar2 build 路径'
      - Pulsar2 Docker image fallback from https://hf-mirror.com/AXERA-TECH/Pulsar2/tree/main
      - HF-hosted artifacts (model weights / Pulsar2 / BSP SDK) must first check ModelScope
        (modelscope_available) and fall back to hf-mirror only when absent
      - 'HF large-file downloads use hf-mirror hfd: scripts/download_hf.sh
        <org>/<name> --local-dir origin/<name> -x 8'
      - HuggingFace downloads default to hf-mirror with HF_ENDPOINT=https://hf-mirror.com
      - GitHub git clone / raw downloads default through GH_PROXY=https://gh-proxy.com
      - Python virtual environments must be managed with uv, defaulting to Aliyun PyPI mirror
        (PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/)
      - ONNX static shape
      - onnxruntime for ONNX validation
      - Python SDK with pyaxengine and AxEngineExecutionProvider by default
      - C++ SDK with CMake and direct AX Engine runtime linking
      - BSP/runtime 与编译器下载地址按芯片来自 ax-pipeline build_common.sh: AX650 (msp_50 + Arm GNU 9.2 aarch64); AX630C / AX620Q（AX620E NPU）(msp_20e + 各自编译器)
      security:
      - do not modify source model repositories
      - do not guess private credentials
      - do not include secrets in package artifacts
      human_approval_required: true
    acceptance:
      # 权威清单：required_artifacts 是产物存在性，checks 是行为/质量性检查。
      # completion.success_when 引用本处，不再逐条复制，避免三处不同步。
      checks:
      - export/model.onnx exists, has static shapes, and loads in onnxruntime
      - export/model_meta.json contains input and output names, shapes, dtypes, and preprocessing notes
      - compile/model.axmodel exists and is non-empty
      - simulate/simulate_report.md records ONNX vs AXMODEL metrics with multi-input mean ± std
      - default cosine similarity is at least 0.99 unless task-specific metrics justify acceptance
      - Python SDK imports successfully and includes a pyaxengine runnable example
      - SDK pre/post-processing matches the original model pipeline in model_flow.json; example calling convention mirrors the original model entry as much as possible
      - C++ SDK configures with CMake and cross-compiles against AX Engine runtime when the aarch64 toolchain is available
      - delivered package SDK minimizes dependencies: when RUNONBOARD passed, Python SDK depends only on numpy + pyaxengine with no onnxruntime/torch/transformers fallback; C++ links only AX Engine runtime
      - when BOARD is provided, Python and C++ SDK examples run on a board whose chip_type matches TARGET_HARDWARE
      - all required_artifacts exist and are non-empty (covers setup.sh, run.sh, compile_pulsar2.sh, READMEs, reports, model_convert files)
      - package/README.md explains model overview, quick start (inference + reproduce), directory layout, performance, and
        limitations
      - 'LLM 路由（model_route=llm）额外检查：compile/llm_model_dir 含 config.json、
        tokenizer 文件、逐层 *.axmodel 与 post axmodel；export/model_meta.json 记录
        route=llm 与 llm_build2 自带逐层 cosine（min ≥ 0.99）；有板时 axllm serve
        通过 OpenAI 兼容接口完成 ≥3 组 prompt 语义验证；LLM Python SDK 依赖仅 requests
        （不含 onnxruntime/torch/transformers/pyaxengine），板端运行依赖 axllm'
      - package self_test passes: fresh copy → bash setup.sh → bash run.sh succeeds with no manual intervention
      - package/model_convert/README.md covers env setup, ONNX export, calibration, pulsar2 compile (full command, no placeholders),
        artifact check, and FAQ
      - package/model_convert/requirements.txt exists with all dependencies grouped by category
      - package/python/README.md covers env setup, install, quick run, API, and preprocessing
      - package/cpp/README.md covers env, local/cross build, board deployment, and API
      - package/reports/performance_report.md exists with pipeline timing, model efficiency, latency, and board memory sections
      - all README commands are complete with no placeholders like "..." or "<path>"
      metrics:
      - cosine_similarity
      - mae
      - max_abs_diff
      - task_specific_accuracy_when_available
      - multi_sample_mean_and_std_for_all_accuracy_metrics
      - onnx_size_bytes
      - axmodel_size_bytes
      - compression_ratio
      - macs
      - macs_utilization_pct
      - inference_latency_ms
      required_artifacts:
      - package/models/model.axmodel
      - package/models/model_meta.json
      - package/python/
      - package/python/README.md
      - package/cpp/
      - package/cpp/README.md
      - package/model_convert/
      - package/model_convert/README.md
      - package/model_convert/requirements.txt
      - package/model_convert/export_onnx.py
      - package/model_convert/compile_pulsar2.sh
      - package/model_convert/pulsar2_config.json
      - package/model_convert/model.onnx
      - package/reports/
      - package/reports/performance_report.md
      - package/README.md
      - package/.gitignore
      - package/setup.sh
      - package/run.sh
    assumptions:
    - The Arm URL supplied by the user is the C++ cross-compilation toolchain source, not a Pulsar2 distribution.
    - Pulsar2 is provided by the user environment, a local binary, a user-specified Docker image/package, or the HuggingFace
      AXERA-TECH/Pulsar2 Docker image fallback through hf-mirror.
    - uv is required for every task virtual environment; missing uv blocks the workflow instead of falling back to venv, virtualenv,
      or conda.
    - 'ax-llm 官方支持 AX650A/AX650N（SDK >= 3.6.2）与 AX630C（SDK >= 3.0.0）；
      AX620E/AX8850 等其他芯片需按 pulsar2 llm_build2 --chip 支持与 ax-llm 实际验证
      结果为准，默认 AX650'
    - 'pulsar2 llm_build2 需要 Pulsar2 >= 6.0；LLM 路由在 TOOLCHAIN 阶段校验该子命令'
    - RUNONBOARD is optional unless BOARD is provided.
    - Dry-run mode (MODE=dry-run) stops after init to present the plan; no large file downloads or compilation occur.
    - ax_run_model is only a model smoke check and never substitutes for Python/C++ SDK execution.
    open_questions: []
  capabilities:
  - id: grill_me_alignment
    purpose: Requirement alignment before workflow design
    source: existing
    skill_path: /home/yrz/.codex/skills/grill-me/SKILL.md
    permissions: []
    required: true
  - id: acquire
    purpose: Acquire remote or local model into TASK_DIR/origin
    source: generate
    skill_path: .codex/skills/magnetar/hidden/acquire/SKILL.md
    permissions:
    - network
    - filesystem
    required: true
  - id: export
    purpose: Export static ONNX, validate source-vs-ONNX, and generate metadata/calibration data
    source: generate
    skill_path: .codex/skills/magnetar/hidden/export/SKILL.md
    permissions:
    - filesystem
    - network
    required: true
  - id: pulsar2
    purpose: Compile ONNX to AXMODEL
    source: install
    skill_path: .codex/skills/magnetar/hidden/toolchain/SKILL.md
    permissions:
    - filesystem
    - docker
    - network
    required: true
  - id: cxx_toolchain
    purpose: Build and validate C++ SDK with chip-specific BSP/runtime + compiler from build_common.sh (AX650 / AX630C / AX620Q)
    source: install
    skill_path: .codex/skills/magnetar/hidden/toolchain/SKILL.md
    permissions:
    - network
    - filesystem
    required: false
  - id: sdk_gen
    purpose: Generate Python and C++ customer SDKs
    source: generate
    skill_path: .codex/skills/magnetar/hidden/sdk-gen/SKILL.md
    permissions:
    - filesystem
    required: true
  - id: board_runtime
    purpose: Optional board-side Python/C++ SDK validation on hardware matching TARGET_HARDWARE
    source: external
    skill_path: .codex/skills/magnetar/hidden/runonboard/SKILL.md
    permissions:
    - network
    - ssh
    required: true
    description: Mandatory board-side Python/C++ SDK validation on hardware matching TARGET_HARDWARE
  inputs:
  - id: SOURCE
    type: text
    required: true
    source: user
    validation:
    - git URL, HuggingFace repo, HTTP URL, local file, or local directory
  - id: TARGET_HARDWARE
    type: text
    required: true
    source: user
    validation:
    - AX650, AX620E, or another Pulsar2-supported AX target confirmed by user
  - id: MODEL_NAME
    type: text
    required: false
    source: user
    validation:
    - inferred from SOURCE when absent
  - id: TASK_DIR
    type: directory
    required: false
    source: user
    validation:
    - defaults to todos/work/<timestamp>-<model-name>/
  - id: HF_TOKEN
    type: credential
    required: false
    source: environment
    validation:
    - required only for private HuggingFace models
  - id: HF_ENDPOINT
    type: url
    required: false
    source: environment
    validation:
    - defaults to https://hf-mirror.com for HuggingFace downloads (空字符串禁用，海外直连)
  - id: GH_PROXY
    type: url
    required: false
    source: environment
    validation:
    - defaults to https://gh-proxy.com; proxies github.com / raw.githubusercontent.com (空字符串禁用)
  - id: PIP_INDEX_URL
    type: url
    required: false
    source: environment
    validation:
    - defaults to https://mirrors.aliyun.com/pypi/simple/ for uv / pip installs
  - id: uv
    type: executable
    required: false
    source: environment
    validation:
    - required for all Python virtual environments
  - id: PULSAR2_IMAGE
    type: text
    required: false
    source: user
    validation:
    - Docker image name or local package reference
  - id: PULSAR2_BIN
    type: file
    required: false
    source: user
    validation:
    - executable Pulsar2 binary path
  - id: PULSAR2_HF_REPO
    type: url
    required: false
    source: external
    validation:
    - defaults to https://hf-mirror.com/AXERA-TECH/Pulsar2/tree/main when local Pulsar2 is unavailable
  - id: AX_LLM_REPO
    type: url
    required: false
    source: environment
    validation:
    - defaults to https://github.com/AXERA-TECH/ax-llm.git (实际访问经 GH_PROXY 代理)
    description: ax-llm 仓库地址（LLM 路由板端运行/服务）
  - id: AX_LLM_BRANCH
    type: text
    required: false
    source: environment
    validation:
    - defaults to axllm
    description: ax-llm 分支，默认 axllm
  - id: AX_LLM_BUILD_REPO
    type: url
    required: false
    source: environment
    validation:
    - defaults to https://github.com/AXERA-TECH/ax-llm-build.git (实际访问经 GH_PROXY 代理)
    description: ax-llm-build 仓库（embedding 处理工具，LLM 路由编译辅助）
  - id: LLM_MAX_CONTEXT
    type: int
    required: false
    source: environment
    validation:
    - positive integer, defaults to 1024
    description: llm_build2 --max_context（decode 最大 attention 长度）
  - id: LLM_PREFILL_LEN
    type: int
    required: false
    source: environment
    validation:
    - non-negative integer, defaults to 0
    description: llm_build2 --prefill_len（prefill 总 token 长度）
  - id: LLM_PREFILL_STEP_SIZE
    type: int
    required: false
    source: environment
    validation:
    - positive integer, optional
    description: llm_build2 --prefill_step_size（每个 prefill 子图 token 数）
  - id: LLM_WEIGHT_TYPE
    type: text
    required: false
    source: environment
    validation:
    - s8, s4, bf16, fp16, fp32
    description: llm_build2 --weight_type，默认 s8；大模型可试 s4（GPTQ INT4 风格 w4a16）
  - id: LLM_HIDDEN_STATE_TYPE
    type: text
    required: false
    source: environment
    validation:
    - bf16, fp16, fp32
    description: llm_build2 --hidden_state_type，默认 bf16
  - id: BOARD
    type: text
    required: false
    source: user
    validation:
    - user@host[:port]
    description: Board SSH info, format user@host[:port]. Optional — when absent RUNONBOARD is skipped and board metrics are N/A.
  - id: BOARD_PASSWORD
    type: credential
    required: false
    source: user
    validation:
    - conditionally required when BOARD is provided; default AX board password 123456
  - id: AUTO_APPROVE
    type: text
    required: false
    source: user
    validation:
    - true or false, defaults to false. When true, skip all per-stage confirmation pauses.
  - id: MODE
    type: text
    required: false
    source: user
    validation:
    - full or dry-run, defaults to full. When dry-run, only scan and plan without downloading large files or compiling.
  outputs:
  - id: axmodel
    type: file
    destination: TASK_DIR/package/models/model.axmodel
    required: true
    validation:
    - exists
    - non_empty
  - id: axmodel_dir
    type: directory
    destination: TASK_DIR/package/models/
    required: false
    validation:
    - 'route=llm 时存在：含 config.json、tokenizer 文件、逐层 *.axmodel、post axmodel'
    - 'route=llm 时 model_meta.json 的 route=llm'
  - id: python_sdk
    type: directory
    destination: TASK_DIR/package/python/
    required: true
    validation:
    - import_check
  - id: cpp_sdk
    type: directory
    destination: TASK_DIR/package/cpp/
    required: true
    validation:
    - cmake_configure
  - id: model_convert
    type: directory
    destination: TASK_DIR/package/model_convert/
    required: true
    validation:
    - contains_export_script
    - contains_pulsar2_config
  - id: reports
    type: directory
    destination: TASK_DIR/package/reports/
    required: true
    validation:
    - export_report
    - compile_report
    - simulate_report
  - id: customer_readme
    type: file
    destination: TASK_DIR/package/README.md
    required: true
    validation:
    - contains_usage
  - id: performance_report
    type: file
    destination: TASK_DIR/package/reports/performance_report.md
    required: true
    validation:
    - contains_pipeline_timing
    - contains_model_efficiency
    - contains_latency
    - contains_board_memory
  - id: model_convert_requirements
    type: file
    destination: TASK_DIR/package/model_convert/requirements.txt
    required: true
    validation:
    - exists
    - non_empty
  - id: compile_script
    type: file
    destination: TASK_DIR/package/model_convert/compile_pulsar2.sh
    required: true
    validation:
    - exists
    - executable
  - id: python_sdk_readme
    type: file
    destination: TASK_DIR/package/python/README.md
    required: true
    validation:
    - exists
    - contains_env_install
    - contains_quick_run
    - contains_api
  - id: cpp_sdk_readme
    type: file
    destination: TASK_DIR/package/cpp/README.md
    required: true
    validation:
    - exists
    - contains_build_steps
    - contains_board_deploy
    - contains_api
  state_machine:
    initial: draft
    states:
    - draft
    - awaiting_user
    - ready
    - running
    - validating
    - retrying
    - rolling_back
    - degraded
    - blocked
    - failed
    - succeeded
    terminal:
    - blocked
    - failed
    - succeeded
    transitions:
    - from: draft
      to: awaiting_user
      when: required information or capability source is missing
    - from: draft
      to: ready
      when: requirements and required capabilities are sufficient
    - from: ready
      to: running
      when: execution starts
    - from: running
      to: validating
      when: current step completes and gate validation triggers
    - from: validating
      to: succeeded
      when: gate passes
    - from: validating
      to: retrying
      when: gate fails but retry budget remains and rollback target is set
    - from: retrying
      to: running
      when: rollback to target step completed, re-entering execution
    - from: retrying
      to: awaiting_user
      when: retry budget exhausted or issues/ search found no fix — need user decision
    - from: running
      to: rolling_back
      when: step on_failure action is rollback
    - from: rolling_back
      to: running
      when: target step reached, ready to re-execute
    - from: rolling_back
      to: awaiting_user
      when: rollback requires user input (e.g., accuracy tuning strategy)
    - from: running
      to: degraded
      when: optional capability fails and degraded output is acceptable
    - from: running
      to: blocked
      when: required external input, permission, or credential is unavailable
    - from: running
      to: failed
      when: non-recoverable error or all retry budgets exhausted
  steps:
  - id: requirements_gate
    kind: gate
    skill: ''
    description: Verify SOURCE, TARGET_HARDWARE, and required capability sources before any execution. BOARD is optional — missing BOARD skips RUNONBOARD.
    depends_on: []
    parallel_group: null
    inputs:
    - SOURCE
    - TARGET_HARDWARE
    - AUTO_APPROVE
    - MODE
    - PULSAR2_IMAGE
    - PULSAR2_BIN
    outputs:
    - requirements_ready
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  - id: acquire
    kind: agent
    skill: .codex/skills/magnetar/hidden/acquire/SKILL.md
    description: Acquire SOURCE into TASK_DIR/origin and produce manifest
    depends_on:
    - requirements_gate
    parallel_group: null
    inputs:
    - SOURCE
    - HF_TOKEN
    - TASK_DIR
    - HF_ENDPOINT
    - GH_PROXY
    - PIP_INDEX_URL
    outputs:
    - origin_path
    - acquire_manifest
    timeout_seconds: 900
    retry:
      max_attempts: 1
      retry_on:
      - network_timeout
      - partial_download
      backoff: exponential
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  - id: init
    kind: agent
    skill: .codex/skills/magnetar/hidden/init/SKILL.md
    description: Initialize TASK_DIR structure and audit logs
    depends_on:
    - stage_review_acquire
    parallel_group: null
    inputs:
    - TASK_DIR
    - MODEL_NAME
    - TARGET_HARDWARE
    - acquire_manifest
    - uv
    outputs:
    - task_md
    - analysis_md
    timeout_seconds: 120
    retry:
      max_attempts: 1
      retry_on:
      - filesystem_transient
      backoff: fixed
    on_failure:
      action: fail
      target_step: null
    visibility: summarized
  - id: dry_run_check
    kind: gate
    skill: ''
    description: If MODE=dry-run, present scan results and estimated plan, then STOP. User must switch to MODE=full to execute.
    depends_on:
    - init
    parallel_group: null
    inputs:
    - MODE
    outputs:
    - plan_accepted
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  - id: model_route
    kind: gate
    skill: ''
    description: '模型路由判定：调用 magnetar.stages.llm.classify(origin, ...)。
      route=llm（自回归/类 LLM，含 hybrid 组合模型）→ 后续 EXPORT/COMPILE/SIMULATE/
      SDK-GEN/RUNONBOARD/PACKAGE 走 ax-llm 分支；route=general → 原通用 ONNX 路径。
      hybrid 模型（如 AR-TTS）需先确认 LLM/AR 子模型拆分方案，无法确认时 STOP。'
    depends_on:
    - dry_run_check
    parallel_group: null
    inputs:
    - origin_path
    - acquire_manifest
    - MODEL_NAME
    - SOURCE
    outputs:
    - model_route
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
      reason: hybrid 组合模型无法自动确认 LLM/AR 子模型拆分方案
    visibility: user_visible
  - id: export
    kind: agent
    skill: .codex/skills/magnetar/hidden/export/SKILL.md
    description: '分支执行：route=general → 导出静态 ONNX 并对分验证；route=llm →
      不导出 ONNX，直接验证 HuggingFace 权重可推理并生成 llm_build.sh（可复现
      llm_build2 命令），hybrid 时同时导出非 LLM 子模型 ONNX'
    depends_on:
    - model_route
    parallel_group: null
    inputs:
    - origin_path
    - acquire_manifest
    - TASK_DIR
    - HF_ENDPOINT
    - PIP_INDEX_URL
    - uv
    - model_route
    outputs:
    - onnx_path
    - model_meta_json
    - calibration_dir
    - export_report
    timeout_seconds: 3600
    retry:
      max_attempts: 1
      retry_on:
      - export_failed
      - validation_mismatch
      - compile_rollback
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
      reason: 多次导出失败，需要用户介入调整模型或提供替代方案；LLM 路由下 llm_build2
        不支持该架构时需用户决定是否回退通用 ONNX 路径
    visibility: user_visible
  - id: toolchain
    kind: agent
    skill: .codex/skills/magnetar/hidden/toolchain/SKILL.md
    description: Verify Pulsar2 and prepare chip-specific C++ BSP/toolchain (下载地址按芯片解析自 ax-pipeline build_common.sh：AX650 / AX630C / AX620Q)；LLM 路由时额外确认 pulsar2 llm_build2 可用（Pulsar2 ≥ 6.0）并准备 ax-llm-build 工具
    depends_on:
    - stage_review_export
    parallel_group: null
    inputs:
    - PULSAR2_IMAGE
    - PULSAR2_BIN
    - PULSAR2_HF_REPO
    - TASK_DIR
    - TARGET_HARDWARE
    - CXX_BSP_URL
    - HF_ENDPOINT
    - GH_PROXY
    - model_route
    outputs:
    - pulsar2_command
    - cxx_toolchain_file
    - ax_runtime_root
    timeout_seconds: 1200
    retry:
      max_attempts: 1
      retry_on:
      - download_failed
      - docker_pull_failed
      backoff: fixed
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  - id: compile
    kind: agent
    skill: .codex/skills/magnetar/hidden/compile/SKILL.md
    description: '分支执行：route=general → pulsar2 build 编译 ONNX 为 AXMODEL；
      route=llm → pulsar2 llm_build2 直接编译 HuggingFace 权重为逐层 axmodel +
      post axmodel + bf16 embedding，并用 ax-llm-build embed_process.sh 处理 embedding、
      生成 axllm config.json/tokenizer，产出 compile/llm_model_dir'
    depends_on:
    - toolchain
    parallel_group: null
    inputs:
    - onnx_path
    - model_meta_json
    - calibration_dir
    - TARGET_HARDWARE
    - pulsar2_command
    - model_route
    outputs:
    - axmodel_path
    - axmodel_dir
    - compile_report
    timeout_seconds: 3600
    retry:
      max_attempts: 1
      retry_on:
      - compile_failed
      - pulsar2_transient
      backoff: none
    on_failure:
      action: rollback
      target_step: export
      reason: Compile失败通常需要调整ONNX导出策略（opset、shape、算子选择等），回退到EXPORT重试；LLM 路由下 llm_build2 失败（架构/算子/head_dim 不支持）也回退 EXPORT 调整参数或由用户决定回退通用路径
    visibility: user_visible
  - id: simulate
    kind: agent
    skill: .codex/skills/magnetar/hidden/simulate/SKILL.md
    description: '分支执行：route=general → 对比 ONNX 与 AXMODEL 输出（有板优先
      ax_run_model，无板 pulsar2 run）；route=llm → 板端安装 axllm 并 axllm serve
      compile/llm_model_dir，通过 OpenAI 兼容接口做 ≥3 组 prompt 语义验证（greedy，
      记录 TTFT/生成 token 数/耗时）；无板时回退 llm_build2 --check_level 2 自带
      校验（逐层 decode/prefill cosine），板端语义验证留到 RUNONBOARD'
    depends_on:
    - stage_review_compile
    parallel_group: null
    inputs:
    - onnx_path
    - axmodel_path
    - model_meta_json
    - TASK_DIR
    - BOARD
    - BOARD_PASSWORD
    - TARGET_HARDWARE
    - model_route
    outputs:
    - simulate_report
    - accuracy_metrics
    - simulation_latency_ms
    timeout_seconds: 1200
    retry:
      max_attempts: 1
      retry_on:
      - simulation_transient
      - tool_error
      backoff: none
    on_failure:
      action: rollback
      target_step: compile
      reason: 仿真工具失败或输出异常，回退到COMPILE调整量化配置（LLM 路由调整
        weight_type/hidden_state_type/context 参数后重新 llm_build2）
    visibility: user_visible
  - id: accuracy_gate
    kind: gate
    skill: ''
    description: 'Decide whether accuracy is acceptable (general: cosine >= 0.99;
      llm: llm_build2 逐层 cosine min >= 0.99 + 有板时 axllm serve 语义验证通过)'
    depends_on:
    - simulate
    parallel_group: null
    inputs:
    - accuracy_metrics
    outputs:
    - accuracy_accepted
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: rollback
      target_step: compile
      reason: 精度不达标。SIMULATE阶段已搜索issues/目录：有已知方案则自动应用修复后回退到COMPILE；通用模型 INT8/U16/混合精度均失败时提议 QAT（官方 AXERA-TECH/QAT.axera）；LLM 路由下先调 weight_type（s8→s4）/hidden_state_type 重编译，仍不达标再 STOP 提议 QAT 或回退通用路径
    visibility: user_visible
  - id: llm_route_acceptance
    kind: gate
    skill: ''
    description: 'LLM 路由专项验收（model_route=llm 时启用，general 自动跳过）：
      compile/llm_model_dir 完整（config.json + tokenizer + 逐层/post axmodel +
      embedding bin）；export/model_meta.json route=llm 且 compile_cosine.min >= 0.99；
      有板时 axllm serve OpenAI 兼容接口 ≥3 组 prompt 全非空；无板时记录 N/A
      并保证 RUNONBOARD 用板端验证补齐'
    depends_on:
    - accuracy_gate
    parallel_group: null
    inputs:
    - model_route
    - accuracy_metrics
    - axmodel_dir
    outputs:
    - llm_acceptance
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: rollback
      target_step: compile
      reason: LLM 产物或精度校验不满足（逐层 cosine < 0.99 / 模型目录缺文件），回退 COMPILE 调整参数
    visibility: user_visible
  - id: sdk_gen
    kind: agent
    skill: .codex/skills/magnetar/hidden/sdk-gen/SKILL.md
    description: '分支执行：route=general → pyaxengine Python SDK + AX runtime C++ SDK；
      route=llm → OpenAI 兼容 HTTP 客户端 Python SDK（依赖仅 requests）+ 可选 C++ HTTP
      客户端，板端运行依赖 axllm serve'
    depends_on:
    - llm_route_acceptance
    parallel_group: null
    inputs:
    - axmodel_path
    - model_meta_json
    - MODEL_NAME
    - cxx_toolchain_file
    - ax_runtime_root
    - GH_PROXY
    - model_route
    outputs:
    - python_sdk_path
    - cpp_sdk_path
    - sdk_report
    timeout_seconds: 1800
    retry:
      max_attempts: 1
      retry_on:
      - generation_error
      - validation_failed
      backoff: none
    on_failure:
      action: fail
      target_step: null
    visibility: user_visible
  - id: stage_review_acquire
    kind: gate
    skill: ''
    description: Present ACQUIRE stage summary and wait for user confirmation. Skipped when AUTO_APPROVE=true.
    depends_on:
    - acquire
    parallel_group: null
    inputs:
    - AUTO_APPROVE
    outputs:
    - review_accepted
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  - id: stage_review_export
    kind: gate
    skill: ''
    description: Present EXPORT stage summary (ONNX, model_meta, calibration) and wait for user confirmation. Skipped when AUTO_APPROVE=true.
    depends_on:
    - export
    parallel_group: null
    inputs:
    - AUTO_APPROVE
    outputs:
    - review_accepted
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  - id: stage_review_compile
    kind: gate
    skill: ''
    description: Present COMPILE stage summary (AXMODEL, MACs, compression ratio) and wait for user confirmation. Skipped when AUTO_APPROVE=true.
    depends_on:
    - compile
    parallel_group: null
    inputs:
    - AUTO_APPROVE
    outputs:
    - review_accepted
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  - id: stage_review_runonboard
    kind: gate
    skill: ''
    description: Present RUNONBOARD stage summary and wait for user confirmation. Skipped when AUTO_APPROVE=true or when BOARD is not provided.
    depends_on:
    - runonboard
    parallel_group: null
    inputs:
    - AUTO_APPROVE
    outputs:
    - review_accepted
    timeout_seconds: null
    retry:
      max_attempts: 0
      retry_on: []
      backoff: none
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
    skip_condition: BOARD is not provided

  - id: runonboard
    kind: agent
    skill: .codex/skills/magnetar/hidden/runonboard/SKILL.md
    description: 'Validate Python and C++ SDKs on the AX board. route=general →
      现有 pyaxengine/AX runtime 验证；route=llm → 板端安装 axllm（ax-llm install.sh），
      axllm serve 模型目录后运行 OpenAI 兼容 SDK 客户端，记录 TTFT/token 速率/内存。
      Ensures ax_remote_infer daemon (port 18500) when general route. Skipped when BOARD is not provided.'
    depends_on:
    - sdk_gen
    parallel_group: null
    inputs:
    - BOARD
    - BOARD_PASSWORD
    - TARGET_HARDWARE
    - axmodel_path
    - model_meta_json
    - TASK_DIR
    - GH_PROXY
    - model_route
    outputs:
    - runonboard_report
    - python_latency_ms
    - cpp_latency_ms
    - system_memory_mb
    - cmm_memory_info
    timeout_seconds: 1800
    retry:
      max_attempts: 1
      retry_on:
      - ssh_transient
      backoff: fixed
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
    skip_condition: BOARD is not provided
  - id: package
    kind: agent
    skill: .codex/skills/magnetar/hidden/package/SKILL.md
    description: 'Assemble final customer package with complete reproducibility: requirements.txt, compile script, detailed
      READMEs for all subdirectories. route=llm → models/ 为 axllm 模型目录（config.json +
      tokenizer + *.axmodel），model_convert 提供可复现 llm_build2 命令与 embed_process，
      setup.sh/run.sh 适配 axllm 安装与 serve'
    depends_on:
    - stage_review_runonboard
    parallel_group: null
    inputs:
    - axmodel_path
    - model_meta_json
    - python_sdk_path
    - cpp_sdk_path
    - export_report
    - compile_report
    - simulate_report
    - runonboard_report
    - model_route
    outputs:
    - package_dir
    - customer_readme
    - performance_report
    - model_convert_readme
    - python_sdk_readme
    - cpp_sdk_readme
    - model_convert_requirements
    - compile_script
    timeout_seconds: 300
    retry:
      max_attempts: 1
      retry_on:
      - filesystem_transient
      backoff: fixed
    on_failure:
      action: fail
      target_step: null
    visibility: user_visible
  - id: publish
    kind: agent
    skill: .codex/skills/magnetar/hidden/publish/SKILL.md
    description: 'Publish the validated package to GitHub (full source) or HuggingFace (pre-compiled model only). STOP: ask user for target, repo name, and credentials.'
    depends_on:
    - package
    parallel_group: null
    inputs:
    - package_dir
    - model_name
    outputs:
    - publish_url
    - publish_target
    timeout_seconds: 300
    retry:
      max_attempts: 1
      retry_on:
      - network_transient
      backoff: fixed
    on_failure:
      action: ask_user
      target_step: null
    visibility: user_visible
  gates:
  - id: required_inputs
    kind: requirement
    depends_on: []
    pass_when:
    - SOURCE is provided
    - TARGET_HARDWARE is provided
    fail_when:
    - SOURCE or TARGET_HARDWARE is missing
    on_pass: proceed to acquire
    on_fail: ask user for missing input
  - id: model_route
    kind: requirement
    depends_on:
    - dry_run_check
    pass_when:
    - classify() 返回 route=llm 或 route=general；hybrid 组合模型已与用户确认
      LLM/AR 子模型拆分方案
    fail_when:
    - 模型既像 LLM 又含其他子模型且拆分方案无法确认
    on_pass: proceed to export（按 model_route 分支执行）
    on_fail: ask user 确认拆分方案或改走通用路径
  - id: pulsar2_available
    kind: capability
    depends_on:
    - toolchain
    pass_when:
    - PULSAR2_BIN works or PULSAR2_IMAGE works or pulsar2 is on PATH or HuggingFace AXERA-TECH/Pulsar2 image is available
      through hf-mirror
    - 'route=llm 时额外要求 pulsar2 llm_build2 可用（Pulsar2 >= 6.0）'
    fail_when:
    - no local, user-provided, or HuggingFace Pulsar2 runtime is available through hf-mirror
    - 'route=llm 但当前 Pulsar2 无 llm_build2 子命令'
    on_pass: proceed to compile
    on_fail: block and request Pulsar2 source
  - id: export_valid
    kind: validation
    depends_on:
    - export
    pass_when:
    - ONNX static shape validation passes
    - ONNXRuntime load passes
    - source-vs-ONNX comparison is acceptable
    fail_when:
    - model export or validation fails
    on_pass: proceed to toolchain
    on_fail: ask user or retry export strategy
  - id: accuracy_gate
    kind: validation
    depends_on:
    - simulate
    pass_when:
    - 'general: cosine >= 0.99 or task-specific metrics are accepted'
    - 'llm: llm_build2 逐层 cosine min >= 0.99，且（有板时）axllm serve 语义验证全非空'
    fail_when:
    - accuracy below threshold
    on_pass: proceed to SDK generation
    on_fail: '回退 COMPILE 调整量化/权重类型参数；仍失败 STOP 提议 QAT 或回退通用路径'
  - id: llm_route_acceptance
    kind: validation
    depends_on:
    - accuracy_gate
    pass_when:
    - 'route=llm 时 compile/llm_model_dir 完整且 export/model_meta.json 的
      compile_cosine.min >= 0.99'
    - '有板时 axllm serve OpenAI 兼容接口 ≥3 组 prompt 验证通过'
    fail_when:
    - LLM 模型目录缺 config.json/tokenizer/逐层 axmodel/post axmodel
    - 逐层 cosine < 0.99
    on_pass: proceed to SDK generation
    on_fail: rollback to compile 调整 llm_build2 参数
  - id: package_validation
    kind: validation
    depends_on:
    - package
    pass_when:
    - all required package artifacts exist including setup.sh and run.sh
    - setup.sh is executable and installs deps in one command
    - run.sh is executable and runs inference in one command
    - model_convert/requirements.txt is present and non-empty
    - model_convert/compile_pulsar2.sh is present and executable
    - model_convert/README.md contains complete pulsar2 build command with no placeholders
    - python/README.md covers env install, quick run, and API
    - cpp/README.md covers local build, cross-compile, board deploy, and API
    - package/README.md covers model overview, two-step quick start, directory layout, performance, and limitations
    - "self_test() passes: simulate a beginner who ONLY reads README → bash setup.sh → bash run.sh → success"
    - RUNONBOARD passed with board validation report
    - performance_report.md exists with pipeline timing, model efficiency, latency, and board memory sections
    fail_when:
    - required artifact is missing
    - any README contains placeholder text ("...", "<path>", "<fill me>")
    - setup.sh or run.sh does not exist or is not executable
    - "self_test() fails (beginner simulation fails)"
    - pulsar2 build command is incomplete or omitted
    - requirements.txt is missing
    - RUNONBOARD could not execute with provided BOARD
    on_pass: proceed to publish
    on_fail: repair scripts/README and retry self_test, max 3 attempts before blocking
  - id: publish_gate
    kind: validation
    depends_on:
    - publish
    pass_when:
    - user confirmed publish target (github or huggingface)
    - user provided repo name
    - user provided credentials (GITHUB_TOKEN or HF_TOKEN)
    - publish URL is accessible
    - no credential leakage in package artifacts
    fail_when:
    - user did not provide target, repo name, or credentials
    - publish push/upload failed with unrecoverable error
    - credentials are empty or invalid
    on_pass: succeeded
    on_fail: ask user to retry with corrected inputs
  failure_policy:
    default_action: fail
    max_total_attempts: 3
    rollback_required_for:
    - compile failure → rollback to export (change ONNX export strategy)
    - simulate tool failure → rollback to compile (adjust quantization config)
    - accuracy_gate failure → rollback to compile (apply issues/ fix or user-adjusted tuning)
    - 'llm 路由 llm_build2 失败（架构/head_dim/算子不支持）→ rollback to export
      （调 weight_type/context 参数或 hybrid 拆分），仍失败 STOP 由用户决定是否回退
      通用 ONNX 路径'
    - 'llm 路由逐层 cosine < 0.99 → rollback to compile 重试（s8→s4 / bf16→fp16 /
      context 参数调整），仍失败 STOP 提议 QAT'
    - package directory rewrite after failed package validation
    - self_test failure → fix scripts/README, re-assemble, retry self_test
    - publish failure → fix credentials/repo, retry publish (max 2)
    ask_user_for:
    - missing SOURCE or TARGET_HARDWARE (checked at requirements gate)
    - private model credentials
    - ambiguous model file or export entry
    - 'hybrid 组合模型（AR-TTS 等）的 LLM/AR 子模型拆分方案'
    - 'llm 路由 llm_build2 不支持该架构时：回退通用 ONNX 路径或改用其他方案'
    - unavailable Pulsar2
    - random-only calibration data
    - accuracy below threshold after issues/ search yields no match
    - board credentials
    - export failed after max retries
    - publish target, repo name, and credentials (asked at publish stage)
    degraded_output_allowed: true
    degraded_conditions:
    - C++ cross compiler unavailable but CMake configure succeeds
  observability:
    progress_updates: milestone
    audit_log:
      enabled: true
      include_hidden_steps: false
    artifacts:
      record_intermediate_outputs: false
      retention: workflow-local
    required_logs:
    - TASK_DIR/task.md
    - TASK_DIR/analysis.md
  completion:
    success_when:
    # 引用 requirement.acceptance（checks + required_artifacts）作为唯一验收权威
    - all requirement.acceptance.checks pass
    - all requirement.acceptance.required_artifacts exist
    - 'model_route=llm 时 llm_route_acceptance 通过（模型目录完整 + 逐层 cosine >= 0.99
      + 有板时 axllm serve 语义验证通过）'
    - RUNONBOARD has been attempted (executed when BOARD provided, skipped when absent) and report exists
    - publish URL is recorded in task.md
    - publish target (github/huggingface) is documented
    failure_when:
    - required Pulsar2 capability is unavailable
    - ONNX export cannot be validated
    - AXMODEL compile fails with no accepted repair path
    - SDK generation fails
    - acceptance checks fail after retry budget is exhausted
    - required Pulsar2 capability is unavailable
    final_response:
      include_artifacts: true
      include_assumptions: true
      include_limitations: true
